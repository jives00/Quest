services:
  api:
    image: ghcr.io/jives00/quest-api:latest
    container_name: quest-api
    ports:
      - "3007:3007"
    networks:
      - shared-db
    environment:
      NODE_ENV: production
      API_PORT: 3007
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET}
      RAWG_API_KEY: ${RAWG_API_KEY}
      STEAMGRIDDB_KEY: ${STEAMGRIDDB_KEY}
      ITAD_API_KEY: ${ITAD_API_KEY}
      STEAM_API_KEY: ${STEAM_API_KEY}
      STEAM_ID64: ${STEAM_ID64}
      PSN_NPSSO: ${PSN_NPSSO}
      OPENXBL_API_KEY: ${OPENXBL_API_KEY}
      SCROBBLE_API_KEY: ${SCROBBLE_API_KEY}
      SCREENSHOT_STAGING_DIR: /data/screenshots
      WALLPAPER_DIR: /data/wallpapers
    volumes:
      # Screenshots waiting for review (originals, thumbnails, cleaned copies).
      - /volume2/docker/quest/screenshots:/data/screenshots
      # \\Synology\Wallpapers\Video Games -- where exported shots land. Check the
      # volume in DSM > Control Panel > Shared Folder: if this path is wrong,
      # Docker silently creates an empty folder here instead of failing.
      - "/volume2/Wallpapers/Video Games:/data/wallpapers"
    restart: unless-stopped

  web:
    image: ghcr.io/jives00/quest-web:latest
    container_name: quest-web
    ports:
      - "3006:3000"
    networks:
      - shared-db
    environment:
      # Runtime proxy target for the Next.js /api rewrite (docker network DNS).
      API_URL: http://quest-api:3007
    restart: unless-stopped

networks:
  shared-db:
    external: true
