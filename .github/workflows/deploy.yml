name: Build and Push Docker Images

on:
  push:
    branches: [main]
    tags: ['apk-*']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/jives00/quest-api:latest

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/jives00/quest-web:latest

  build-apk:
    name: Build Android APK (Gradle)
    if: startsWith(github.ref, 'refs/tags/apk-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - name: Write mobile .env
        run: |
          echo "EXPO_PUBLIC_API_URL=http://${{ secrets.TAILSCALE_HOSTNAME }}:3007" > apps/mobile/.env
          echo "EXPO_PUBLIC_BUILD_TAG=${{ github.ref_name }}" >> apps/mobile/.env
      - name: Prebuild Android
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean
      - name: Inject stable keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > apps/mobile/android/app/debug.keystore
      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew app:assembleRelease -x lint -x test -PreactNativeArchitectures=arm64-v8a
      - name: Rename APK
        id: apk
        run: |
          TIMESTAMP=$(date -u +'%m%d%Y-%H%M')
          APK_NAME="quest-${TIMESTAMP}.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "${APK_NAME}"
          echo "name=${APK_NAME}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.apk.outputs.name }}
      - name: Send email notification
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.NOTIFY_EMAIL }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: jbromberek@gmail.com
          from: Quest CI <${{ secrets.NOTIFY_EMAIL }}>
          subject: "Quest APK build complete — ${{ steps.apk.outputs.name }}"
          body: |
            Build succeeded for ${{ steps.apk.outputs.name }}.

            Direct download (no login required):
            ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.apk.outputs.name }}
